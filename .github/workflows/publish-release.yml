name: Publish versioned release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-release.yml"
      - "README.md"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v1.0.1"
        required: true
        type: string
      target_sha:
        description: "Commit SHA to tag"
        required: true
        type: string
      artifact_run_id:
        description: "Successful Android build workflow run ID containing eujor-smsgateway-debug"
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Select release details
        id: release
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "tag_name=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "target_sha=${{ inputs.target_sha }}" >> "$GITHUB_OUTPUT"
            echo "artifact_run_id=${{ inputs.artifact_run_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=v1.0.0" >> "$GITHUB_OUTPUT"
            echo "target_sha=04d50fd3a5d77a5f79e531b5fa0f5b7adda4e73f" >> "$GITHUB_OUTPUT"
            echo "artifact_run_id=46036742201" >> "$GITHUB_OUTPUT"
          fi

      - name: Download successful Android build artifact
        uses: actions/download-artifact@v7
        with:
          name: eujor-smsgateway-debug
          path: downloaded-artifact
          repository: ${{ github.repository }}
          run-id: ${{ steps.release.outputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release APK
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          APK="$(find downloaded-artifact -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p release-assets
          cp "$APK" "release-assets/EUJOR-SMS-USSD-Gateway-${RELEASE_TAG}.apk"
          test -s "release-assets/EUJOR-SMS-USSD-Gateway-${RELEASE_TAG}.apk"

      - name: Create annotated version tag, GitHub Release and attach APK
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
        with:
          script: |
            const fs = require('fs');
            const tagName = process.env.RELEASE_TAG;
            const targetSha = process.env.TARGET_SHA;
            const { owner, repo } = context.repo;

            if (!/^v[0-9]+[.][0-9]+[.][0-9]+$/.test(tagName)) {
              throw new Error('Release tag must use semantic version format, e.g. v1.0.1.');
            }

            const commit = await github.rest.git.getCommit({ owner, repo, commit_sha: targetSha });
            if (commit.data.sha !== targetSha) {
              throw new Error('The selected target SHA could not be verified.');
            }

            const releaseTitle = 'EUJOR SMS & USSD Gateway ' + tagName;
            const releaseBody = [
              '# ' + releaseTitle,
              '',
              'Third-party receiver integration reference for the EUJOR Android SMS & USSD Gateway.',
              '',
              '## Server-to-device USSD job',
              'The device API key is sent in the Authorization: Bearer header, not in the job JSON. Include device_id, job_id, request_id, type: ussd, action: execute, a 1-based sim_slot, and code as a string such as *188#. Optional inputs is an array of separate strings, for example ["1", "2", "254712345678"].',
              '',
              '## Device result callback',
              'The phone POSTs USSD events to /api/v1/agent/results. Events include event_id, device_id, job_id, request_id, type, status, result and timestamp. The result.response field contains the visible carrier text. Interactive sessions may send screen_updated, input_queued and input_submitted progress events before a final event.',
              '',
              '## Required server acknowledgement',
              'After validating and durably storing each event, return HTTP 200 with JSON containing success: true and the exact same event_id. The app does not accept HTTP 202, another 2xx status, or a missing/invalid/mismatched acknowledgement as confirmation.',
              '',
              'The app retries up to 6 times per batch at 10-second intervals, pauses 5 minutes between batches, and drops an event after its 12-hour retention lifetime. Retries reuse the same event_id. The receiver must deduplicate event_id and acknowledge an already-stored duplicate without processing it twice.',
              '',
              'An acknowledgement confirms durable receiver receipt/logging, not carrier-side USSD success. input_submitted does not prove carrier acceptance; completed does not prove a commercial transaction succeeded. Interpret the returned USSD text.',
              '',
              '## APK',
              'The attached APK is the debug build produced by GitHub Actions for the v1.0.0 application source. It is intended for testing and is not a Play Store-signed production release.',
              '',
              'See the [README](https://github.com/' + owner + '/' + repo + '/blob/main/README.md) and [API protocol](https://github.com/' + owner + '/' + repo + '/blob/main/docs/API_PROTOCOL.md) for the complete integration contract.',
              '',
              'Physical-device validation remains necessary for SIM selection and carrier/OEM-specific USSD behaviour.'
            ].join('\n');
            let release;

            try {
              const existingRef = await github.rest.git.getRef({ owner, repo, ref: 'tags/' + tagName });
              let existingCommitSha = existingRef.data.object.sha;
              if (existingRef.data.object.type === 'tag') {
                const annotated = await github.rest.git.getTag({ owner, repo, tag_sha: existingCommitSha });
                existingCommitSha = annotated.data.object.sha;
              }
              if (existingCommitSha !== targetSha) {
                throw new Error('Tag ' + tagName + ' already points to a different commit; refusing to move it.');
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              const annotatedTag = await github.rest.git.createTag({
                owner,
                repo,
                tag: tagName,
                message: 'EUJOR SMS & USSD Gateway ' + tagName,
                object: targetSha,
                type: 'commit',
                tagger: {
                  name: 'EUJOR Release Automation',
                  email: 'release-bot@users.noreply.github.com',
                  date: new Date().toISOString()
                }
              });
              await github.rest.git.createRef({
                owner,
                repo,
                ref: 'refs/tags/' + tagName,
                sha: annotatedTag.data.sha
              });
            }

            try {
              const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag: tagName });
              release = existing.data;
              const updated = await github.rest.repos.updateRelease({
                owner, repo, release_id: release.id, name: releaseTitle, body: releaseBody
              });
              release = updated.data;
            } catch (error) {
              if (error.status !== 404) throw error;
              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tagName,
                target_commitish: targetSha,
                name: releaseTitle,
                draft: false,
                prerelease: false,
                generate_release_notes: false,
                body: releaseBody
              });
              release = created.data;
            }
            const assetName = `EUJOR-SMS-USSD-Gateway-${tagName}.apk`;
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.id
            });
            if (assets.some(asset => asset.name === assetName)) {
              core.info(`Release asset ${assetName} already exists; leaving it unchanged.`);
            } else {
              const data = fs.readFileSync(`release-assets/${assetName}`);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name: assetName,
                data,
                headers: {
                  'content-type': 'application/vnd.android.package-archive',
                  'content-length': data.length
                }
              });
            }

            core.info(`Published ${releaseTitle} at ${targetSha}`);
